<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>I LOVE YOU, FRISKA ♥</title>
<meta name="description" content="I Love You in 114 Languages — Dedicated to Friska ♥">
<style>
  :root {
    --pink: #ff7ab6;
    --pink-glow: rgba(255, 122, 182, 0.38);
    --dim: #8a8093;
    --bg: #000000;
  }
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }
  html, body {
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: #fff;
    font-family: Consolas, Menlo, 'DejaVu Sans Mono', 'Courier New', monospace;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  #stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    max-width: 100vw;
    max-height: 100vh;
    width: auto;
    height: auto;
    object-fit: contain;
    cursor: grab;
    touch-action: none;
  }
  canvas:active {
    cursor: grabbing;
  }
  .dedication-banner {
    position: fixed;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    text-align: center;
    pointer-events: none;
    background: rgba(18, 8, 16, 0.65);
    border: 1px solid rgba(255, 122, 182, 0.35);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 8px 22px;
    border-radius: 999px;
    box-shadow: 0 0 25px var(--pink-glow);
    animation: floatPulse 4s ease-in-out infinite;
  }
  .dedication-banner h1 {
    font-size: clamp(14px, 2.5vw, 19px);
    font-weight: 700;
    letter-spacing: 2.5px;
    color: #ffe6f2;
    text-shadow: 0 0 12px var(--pink);
  }
  .dedication-banner h1 span {
    color: var(--pink);
  }
  @keyframes floatPulse {
    0%, 100% { transform: translateX(-50%) translateY(0px); box-shadow: 0 0 22px var(--pink-glow); }
    50% { transform: translateX(-50%) translateY(-3px); box-shadow: 0 0 34px rgba(255, 122, 182, 0.6); }
  }
  .controls {
    position: fixed;
    bottom: 20px;
    right: 24px;
    z-index: 10;
    display: flex;
    gap: 8px;
  }
  .btn {
    background: rgba(24, 12, 22, 0.72);
    color: #f5d0e3;
    border: 1px solid rgba(255, 122, 182, 0.32);
    border-radius: 999px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 0.5px;
    cursor: pointer;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition: all 0.2s ease;
  }
  .btn:hover {
    background: rgba(255, 122, 182, 0.22);
    border-color: var(--pink);
    color: #fff;
    box-shadow: 0 0 14px var(--pink-glow);
  }
  #loading {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #000;
    color: var(--pink);
    font-size: 16px;
    letter-spacing: 2px;
    z-index: 100;
    transition: opacity 0.4s ease;
  }
  @media (max-width: 640px) {
    .controls {
      bottom: 14px;
      right: 50%;
      transform: translateX(50%);
    }
  }
</style>
</head>

function smooth(x) {
  if (x <= 0) return 0;
  if (x >= 1) return 1;
  return x * x * (3 - 2 * x);
}

// Exact 2D Euclidean Distance Transform (Felzenszwalb & Huttenlocher)
function computeEDT(mask, w, h) {
  const INF = 1e9;
  const f = new Float32Array(Math.max(w, h));
  const d = new Float32Array(w * h);
  const v = new Int32Array(Math.max(w, h));
  const z = new Float32Array(Math.max(w, h) + 1);

  function edt1d(n) {
    let k = 0;
    v[0] = 0;
    z[0] = -INF;
    z[1] = INF;
    for (let q = 1; q < n; q++) {
      let s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]);
      while (s <= z[k]) {
        k--;
        s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]);
      }
      k++;
      v[k] = q;
      z[k] = s;
      z[k + 1] = INF;
    }
    k = 0;
    for (let q = 0; q < n; q++) {
      while (z[k + 1] < q) k++;
      const dx = q - v[k];
      f[q] = dx * dx + f[v[k]];
    }
  }

  for (let x = 0; x < w; x++) {
    for (let y = 0; y < h; y++) {
      f[y] = mask[y * w + x] ? INF : 0;
    }
    edt1d(h);
    for (let y = 0; y < h; y++) d[y * w + x] = f[y];
  }
  for (let y = 0; y < h; y++) {
    const row = y * w;
    for (let x = 0; x < w; x++) f[x] = d[row + x];
    edt1d(w);
    for (let x = 0; x < w; x++) d[row + x] = Math.sqrt(f[x]);
  }
  return d;
}

function gaussianBlur2D(src, w, h, sigma) {
  const radius = Math.ceil(sigma * 3);
  const ksize = radius * 2 + 1;
  const kernel = new Float32Array(ksize);
  let sum = 0;
  for (let i = -radius; i <= radius; i++) {
    const val = Math.exp(-(i * i) / (2 * sigma * sigma));
    kernel[i + radius] = val;
    sum += val;
  }
  for (let i = 0; i < ksize; i++) kernel[i] /= sum;

  const tmp = new Float32Array(w * h);
  const dst = new Float32Array(w * h);

  for (let y = 0; y < h; y++) {
    const row = y * w;
    for (let x = 0; x < w; x++) {
      let acc = 0;
      for (let k = -radius; k <= radius; k++) {
        const xx = Math.min(w - 1, Math.max(0, x + k));
        acc += src[row + xx] * kernel[k + radius];
      }
      tmp[row + x] = acc;
    }
  }
  for (let y = 0; y < h; y++) {
    const row = y * w;
    for (let x = 0; x < w; x++) {
      let acc = 0;
      for (let k = -radius; k <= radius; k++) {
        const yy = Math.min(h - 1, Math.max(0, y + k));
        acc += tmp[yy * w + x] * kernel[k + radius];
      }
      dst[row + x] = acc;
    }
  }
  return dst;
}

  const actx = ac.getContext("2d");
  actx.drawImage(atlasImg, 0, 0);
  const aData = actx.getImageData(0, 0, ac.width, ac.height).data;
  const aw = ac.width;

  const SCALED_SPRITES = new Array(N);
  for (let i = 0; i < N; i++) {
    const [ax, ay, sw, sh] = META[i];
    const buf = new Float32Array(sw * sh);
    for (let y = 0; y < sh; y++) {
      const rOff = (ay + y) * aw + ax;
      const dOff = y * sw;
      for (let x = 0; x < sw; x++) {
        buf[dOff + x] = aData[(rOff + x) * 4] / 255.0;
      }
    }
    SCALED_SPRITES[i] = { w: sw, h: sh, data: buf };
  }

  const _CACHE = new Map();
  function getSprite(idx, k) {
    if (Math.abs(k - _K) < 1e-6) return SCALED_SPRITES[idx];
    const key = idx * 10000 + Math.round(k * 200);
    if (_CACHE.has(key)) return _CACHE.get(key);
    const src = SCALED_SPRITES[idx];
    const origW = META[idx][4], origH = META[idx][5];
    const tw = Math.max(1, Math.round(origW * k));
    const th = Math.max(1, Math.round(origH * k));
    const dst = new Float32Array(tw * th);
    for (let y = 0; y < th; y++) {
      const sy = Math.min(src.h - 1, Math.floor((y + 0.5) * src.h / th));
      for (let x = 0; x < tw; x++) {
        const sx = Math.min(src.w - 1, Math.floor((x + 0.5) * src.w / tw));
        dst[y * tw + x] = src.data[sy * src.w + sx];
      }
    }
    const res = { w: tw, h: th, data: dst };
    _CACHE.set(key, res);
    return res;
  }

  // 2. Heart outline mask
  const maskCanvas = document.createElement("canvas");
  maskCanvas.width = W;
  maskCanvas.height = H;
  const mctx = maskCanvas.getContext("2d");
  mctx.fillStyle = "#000";
  mctx.fillRect(0, 0, W, H);
  mctx.fillStyle = "#fff";
  mctx.beginPath();
  for (let i = 0; i < HALF.length; i++) {
    const px = CX + HALF[i][0] * WIDTH;
    const py = CY + HALF[i][1] * WIDTH;
    if (i === 0) mctx.moveTo(px, py);
    else mctx.lineTo(px, py);
  }
  for (let i = HALF.length - 1; i >= 0; i--) {
    const px = CX - HALF[i][0] * WIDTH;
    const py = CY + HALF[i][1] * WIDTH;
    mctx.lineTo(px, py);
  }
  mctx.closePath();
  mctx.fill();
  const mData = mctx.getImageData(0, 0, W, H).data;
  const INSIDE = new Uint8Array(W * H);
  for (let i = 0; i < W * H; i++) INSIDE[i] = mData[i * 4] > 127 ? 1 : 0;

  // 3. Distance transform, RAD, Z, normals
  const DIST = computeEDT(INSIDE, W, H);
  let maxDist = 0;
  for (let i = 0; i < W * H; i++) if (DIST[i] > maxDist) maxDist = DIST[i];
  const RAD = new Float32Array(W * H);
  const rawZ = new Float32Array(W * H);
  for (let i = 0; i < W * H; i++) {
    const r = 1.0 - DIST[i] / maxDist;
    RAD[i] = r;
    if (INSIDE[i]) {
      const d = DIST[i];
      const lip = Math.exp(-Math.pow((d - 14) / 5.0, 2)) * 10.0 - Math.exp(-Math.pow((d - 34) / 7.0, 2)) * 7.0;
      const dome = DOME * Math.sqrt(Math.max(0, 1.0 - r * r));
      rawZ[i] = WALL + dome + lip;
    }
  }
  const Z = gaussianBlur2D(rawZ, W, H, 2.0);
  for (let i = 0; i < W * H; i++) if (!INSIDE[i]) Z[i] = 0;

  const NX0 = new Float32Array(W * H);
  const NY0 = new Float32Array(W * H);
  const NZ0 = new Float32Array(W * H);
  for (let y = 0; y < H; y++) {
    const row = y * W;
    const yPrev = Math.max(0, y - 1) * W;
    const yNext = Math.min(H - 1, y + 1) * W;
    const dyScale = (y === 0 || y === H - 1) ? 1.0 : 0.5;
    for (let x = 0; x < W; x++) {
      if (!INSIDE[row + x]) continue;
      const xPrev = Math.max(0, x - 1);
      const xNext = Math.min(W - 1, x + 1);
      const dxScale = (x === 0 || x === W - 1) ? 1.0 : 0.5;
      const zx = (Z[row + xNext] - Z[row + xPrev]) * dxScale;
      const zy = (Z[yNext + x] - Z[yPrev + x]) * dyScale;
      const invNorm = 1.0 / Math.hypot(zx, zy, 1.0);
      NX0[row + x] = -zx * invNorm;
      NY0[row + x] = zy * invNorm;
      NZ0[row + x] = invNorm;
    }
  }

  // 4. Pixel runs inside the heart
  const RUNS = [];
  for (let y = 0; y < H; y++) {
    const row = y * W;
    let x = 0;
    while (x < W) {
      while (x < W && !INSIDE[row + x]) x++;
      if (x >= W) break;
      const x0 = x;
      while (x < W && INSIDE[row + x]) x++;
      RUNS.push({ y, x0, x1: x - 1 });
    }
  }

  // 5. Fit rows and layout phrases (including Friska phrases!)
  function fitRow(xl, xr, first, k) {
    const span = xr - xl;
    const picks = [];
    let used = 0.0, j = first;
    for (let step = 0; step < 40; step++) {
      const preferFriska = FRISKA_IDS.length > 0 && (step % 3 === 1);
      let foundIdx = -1, foundW = 0;
      for (let tries = 0; tries < 12; tries++) {
        let idx;
        if (preferFriska && tries < FRISKA_IDS.length) {
          idx = FRISKA_IDS[(first + step + tries) % FRISKA_IDS.length];
        } else {
          idx = (j + tries * 5) % N;
        }
        const w = META[idx][4] * k;
        if (used + w + (picks.length > 0 ? GAP : 0) <= span) {
          foundIdx = idx;
          foundW = w;
          break;
        }
      }
      if (foundIdx < 0) break;
      used += foundW + (picks.length > 0 ? GAP : 0);
      picks.push([foundIdx, foundW]);
      j = foundIdx + 7;
    }
    if (picks.length === 0) return [];
    let totalW = 0;
    for (const [, w] of picks) totalW += w;
    const gap = (span - totalW) / Math.max(picks.length - 1, 1);
    const out = [];
    let x = picks.length > 1 ? xl : xl + (span - picks[0][1]) / 2;
    for (const [idx, w] of picks) {
      out.push([idx, x, w]);
      x += w + gap;
    }
    return out;
  }

  const LAYOUT = [[], []];
  const sideRowSet = new Set();
  const yStart = Math.floor(CY - 0.47 * WIDTH);
  const yEnd = Math.floor(CY + 0.46 * WIDTH);
  let rIdx = 0;
  for (let y = yStart; y < yEnd; y += PITCH, rIdx++) {
    const by0 = Math.max(y - (TEXT_PX >> 1), 0);
    const by1 = Math.min(y + (TEXT_PX >> 1), H - 1);
    const cols = [];
    for (let x = 0; x < W; x++) {
      let maxR = 0;
      for (let yy = by0; yy < by1; yy++) {
        const val = RAD[yy * W + x];
        if (val > maxR) maxR = val;
      }
      if (maxR < 0.985) cols.push(x);
    }
    if (cols.length < 20) continue;
    let startIdx = 0;
    for (let i = 0; i < cols.length; i++) {
      if (i === cols.length - 1 || cols[i + 1] - cols[i] > 1) {
        const runLen = i - startIdx + 1;
        if (runLen >= 20) {
          const xl = cols[startIdx], xr = cols[i];
          for (let side = 0; side <= 1; side++) {
            const fitted = fitRow(xl, xr, rIdx * 13 + side * 29 + xl, _K);
            for (let j = 0; j < fitted.length; j++) {
              const [idx, fx, fw] = fitted[j];
              LAYOUT[side].push([rIdx, j, idx, fx, fw, y]);
              if (side === 0) sideRowSet.add(y);
            }
          }
        }
        startIdx = i + 1;
      }
    }
  }
  const SIDE_ROWS = Array.from(sideRowSet).sort((a, b) => a - b);

  function stamp(layer, idx, cx, cy, k, shown) {
    const sp = getSprite(idx, k);
    const w = sp.w, h = sp.h;
    const isRtl = RTL.has(PHRASES[idx][0]);
    const cut = shown < 1 ? Math.floor(w * shown) : w;
    const boost = idx >= 114 ? 1.18 : 1.0;
    const x0 = Math.floor(cx - w / 2);
    const y0 = Math.floor(cy - h / 2);
    const cx0 = Math.max(x0, 0), cy0 = Math.max(y0, 0);
    const cx1 = Math.min(x0 + w, W), cy1 = Math.min(y0 + h, H);
    if (cx1 <= cx0 || cy1 <= cy0) return;

    const sData = sp.data;
    for (let yy = cy0; yy < cy1; yy++) {
      const sy = yy - y0;
      const lRow = yy * W;
      const sRow = sy * w;
      for (let xx = cx0; xx < cx1; xx++) {
        const sx = xx - x0;
        if (shown < 1) {
          if (isRtl) {
            if (sx < w - cut) continue;
          } else {
            if (sx >= cut) continue;
          }
        }
        const val = sData[sRow + sx] * boost;
        if (val > layer[lRow + xx]) layer[lRow + xx] = val;
      }
    }
  }

  const frontTex = new Float32Array(W * H);
  const backTex = new Float32Array(W * H);
  const sideTex = [new Float32Array(H * WD), new Float32Array(H * WD)];
  let staticCached = false;
  let cachedCount = 0;

  function buildTextures(t) {
    if (t >= BUILD && staticCached) return cachedCount;
    frontTex.fill(0);
    backTex.fill(0);
    sideTex[0].fill(0);
    sideTex[1].fill(0);
    let count = 0;

    for (let side = 0; side <= 1; side++) {
      const target = side === 0 ? frontTex : backTex;
      const list = LAYOUT[side];
      for (let i = 0; i < list.length; i++) {
        const [r, j, idx, x, w, y] = list[i];
        const start = 0.1 + ((r * 7919 + j * 104729 + side * 31) % 997) / 997 * (BUILD - 0.6);
        const shown = smooth((t - start) / 0.3);
        if (shown > 0) {
          stamp(target, idx, x + w / 2, y, _K, shown);
          count++;
        }
      }
    }

    for (let end = 0; end <= 1; end++) {
      const tex = sideTex[end];
      for (let r = 0; r < SIDE_ROWS.length; r++) {
        const y = SIDE_ROWS[r];
        let idx = 0, ks = _K;
        for (let tries = 0; tries < N; tries++) {
          idx = (r * 17 + end * 41 + tries * 3) % N;
          ks = Math.min(_K, (WD - 6) / META[idx][4]);
          if (ks >= _K * 0.55) break;
        }
        const start = 0.1 + ((r * 6007 + end * 911) % 997) / 997 * (BUILD - 0.6);
        const shown = smooth((t - start) / 0.3);
        if (shown > 0) {
          const sp = getSprite(idx, ks);
          const hh = sp.h, ww = sp.w;
          const x0 = Math.floor(WD / 2 - ww / 2);
          const y0 = Math.floor(y - hh / 2);
          if (y0 >= 0 && y0 + hh <= H && x0 >= 0) {
            const boost = idx >= 114 ? 1.18 : 1.0;
            for (let yy = 0; yy < hh; yy++) {
              const dRow = (y0 + yy) * WD + x0;
              const sRow = yy * ww;
              for (let xx = 0; xx < ww; xx++) {
                const v = sp.data[sRow + xx] * boost;
                if (v > tex[dRow + xx]) tex[dRow + xx] = v;
              }
            }
            count++;
          }
        }
      }
    }

    if (t >= BUILD) {
      staticCached = true;
      cachedCount = count;
    }
    return count;
  }

  // Fast renderer buffers
  const outBuf = new Float32Array(W * H * 3);
  const trailBuf = new Float32Array(W * H * 3);
  let hasTrail = false;
  const zbuf = new Float32Array(W);
  zbuf.fill(-1e9);
  const winTex = new Float32Array(W);
  const winNxr = new Float32Array(W);
  const winNy = new Float32Array(W);
  const winNzr = new Float32Array(W);
  const winIsWall = new Uint8Array(W);

  function renderFrame(t, angleOffset) {
    const count = buildTextures(t);
    const th = 2 * Math.PI * (t / TURN) + angleOffset;
    const c = Math.cos(th), s = Math.sin(th);
    outBuf.fill(0);

    for (let r = 0; r < RUNS.length; r++) {
      const { y, x0, x1 } = RUNS[r];
      const row = y * W;
      let minCol = W, maxCol = -1;

      // Front and back faces
      for (let x = x0; x <= x1; x++) {
        const p = row + x;
        const X = x - CX;
        const z = Z[p];
        const nx0 = NX0[p], ny0 = NY0[p], nz0 = NZ0[p];

        const xc = X * c, xs = X * s;
        const zc = z * c, zs = z * s;
        const nxrF = nx0 * c + nz0 * s;
        const nzrF = -nx0 * s + nz0 * c;

        // Front face point
        if (nzrF > -0.05) {
          const col = Math.round(xc + zs + CX);
          if (col >= 0 && col < W) {
            const depth = -xs + zc;
            if (col < minCol) minCol = col;
            if (col > maxCol) maxCol = col;
            if (depth > zbuf[col]) {
              zbuf[col] = depth;
              winTex[col] = frontTex[p];
              winNxr[col] = nxrF;
              winNy[col] = ny0;
              winNzr[col] = nzrF;
              winIsWall[col] = 0;
            }
          }
        }

        // Back face point (nzrB = -nzrF, nxrB = -nxrF)
        const nzrB = -nzrF;
        if (nzrB > -0.05) {
          const col = Math.round(xc - zs + CX);
          if (col >= 0 && col < W) {
            const depth = -xs - zc;
            if (col < minCol) minCol = col;
            if (col > maxCol) maxCol = col;
            if (depth > zbuf[col]) {
              zbuf[col] = depth;
              const bx = Math.min(W - 1, Math.max(0, 2 * CX - x));
              winTex[col] = backTex[row + bx];
              winNxr[col] = -nxrF;
              winNy[col] = ny0;
              winNzr[col] = nzrB;
              winIsWall[col] = 0;
            }
          }
        }
      }

      // Side walls at both ends of the run
      for (let end = 0; end <= 1; end++) {
        const nxW = end === 0 ? -1.0 : 1.0;
        const nzrW = -nxW * s;
        if (nzrW <= -0.05) continue;
        const nxrW = nxW * c;
        const xe = end === 0 ? x0 : x1;
        const ze = Math.max(Z[row + xe], WALL * 0.8);
        const Xw = xe - CX;
        const xc = Xw * c, xs = Xw * s;
        const sTex = sideTex[end];
        const yOff = y * WD;

        for (let zsVal = -ze; zsVal < ze; zsVal += 0.7) {
          const col = Math.round(xc + zsVal * s + CX);
          if (col >= 0 && col < W) {
            const depth = -xs + zsVal * c;
            if (col < minCol) minCol = col;
            if (col > maxCol) maxCol = col;
            if (depth > zbuf[col]) {
              const u = Math.floor(((end === 0 ? (ze - zsVal) : (zsVal + ze)) / (2 * ze)) * (WD - 1));
              zbuf[col] = depth;
              winTex[col] = sTex[yOff + u];
              winNxr[col] = nxrW;
              winNy[col] = 0.12;
              winNzr[col] = nzrW;
              winIsWall[col] = 1;
            }
          }
        }
      }

      // Shade visible winning pixels in this row
      if (minCol <= maxCol) {
        for (let col = minCol; col <= maxCol; col++) {
          if (zbuf[col] <= -1e8) continue;
          zbuf[col] = -1e9;
          const texVal = winTex[col];
          if (texVal <= 0.001) continue;

          const nzr = winNzr[col];
          const nxr = winNxr[col];
          const ry = winIsWall[col] ? 0.25 : (2.0 * nzr * winNy[col]);
          const rx = 2.0 * nzr * nxr;

          const sky = smooth((ry - 0.12) / 0.3);
          const floor = smooth((-ry - 0.05) / 0.4);
          const band = 1.0 - sky - floor;
          const streak = Math.exp(-Math.pow((rx + 0.35) / 0.08, 2)) * smooth((ry + 0.1) / 0.3) * 0.5;

          const rim = Math.max(0.0, Math.min(1.0, 1.0 - Math.abs(nzr)));
          const mult = texVal * (0.95 + 0.8 * rim);

          const idx3 = (row + col) * 3;
          outBuf[idx3]     = (BAND[0] * band + SKY[0] * sky + FLOOR[0] * floor + streak) * mult;
          outBuf[idx3 + 1] = (BAND[1] * band + SKY[1] * sky + FLOOR[1] * floor + streak) * mult;
          outBuf[idx3 + 2] = (BAND[2] * band + SKY[2] * sky + FLOOR[2] * floor + streak) * mult;
        }
      }
    }
    return count;
  }

  // Fast downsample + separable blur for HDR bloom glow
  function makeGlowBuffer(k) {
    const gw = Math.floor(W / k), gh = Math.floor(H / k);
    return {
      k, gw, gh,
      small: new Float32Array(gw * gh * 3),
      tmp: new Float32Array(gw * gh * 3)
    };
  }
  const glow4 = makeGlowBuffer(4);
  const glow8 = makeGlowBuffer(8);

  function computeGlow(src, g, sigma) {
    const { k, gw, gh, small, tmp } = g;
    const invK2 = 1.0 / (k * k);
    for (let y = 0; y < gh; y++) {
      for (let x = 0; x < gw; x++) {
        let r = 0, gr = 0, b = 0;
        const sy0 = y * k, sx0 = x * k;
        for (let dy = 0; dy < k; dy++) {
          const row = ((sy0 + dy) * W + sx0) * 3;
          for (let dx = 0; dx < k; dx++) {
            const p = row + dx * 3;
            r += src[p];
            gr += src[p + 1];
            b += src[p + 2];
          }
        }
        const dstP = (y * gw + x) * 3;
        small[dstP] = r * invK2;
        small[dstP + 1] = gr * invK2;
        small[dstP + 2] = b * invK2;
      }
    }

    const rad = Math.max(1, Math.ceil(sigma * 2.5));
    const ksize = rad * 2 + 1;
    const kern = new Float32Array(ksize);
    let ksum = 0;
    for (let i = -rad; i <= rad; i++) {
      const v = Math.exp(-(i * i) / (2 * sigma * sigma));
      kern[i + rad] = v;
      ksum += v;
    }
    for (let i = 0; i < ksize; i++) kern[i] /= ksum;

    for (let y = 0; y < gh; y++) {
      const row = y * gw;
      for (let x = 0; x < gw; x++) {
        let r = 0, gr = 0, b = 0;
        for (let i = -rad; i <= rad; i++) {
          const xx = Math.min(gw - 1, Math.max(0, x + i));
          const p = (row + xx) * 3;
          const w = kern[i + rad];
          r += small[p] * w;
          gr += small[p + 1] * w;
          b += small[p + 2] * w;
        }
        const dp = (row + x) * 3;
        tmp[dp] = r; tmp[dp + 1] = gr; tmp[dp + 2] = b;
      }
    }

    for (let y = 0; y < gh; y++) {
      const row = y * gw;
      for (let x = 0; x < gw; x++) {
        let r = 0, gr = 0, b = 0;
        for (let i = -rad; i <= rad; i++) {
          const yy = Math.min(gh - 1, Math.max(0, y + i));
          const p = (yy * gw + x) * 3;
          const w = kern[i + rad];
          r += tmp[p] * w;
          gr += tmp[p + 1] * w;
          b += tmp[p + 2] * w;
        }
        const dp = (row + x) * 3;
        small[dp] = r; small[dp + 1] = gr; small[dp + 2] = b;
      }
    }
  }

  const canvas = document.getElementById("screen");
  const ctx = canvas.getContext("2d");
  const imgData = ctx.createImageData(W, H);
  const pixels = imgData.data;
  for (let i = 3; i < pixels.length; i += 4) pixels[i] = 255;

  const loadingEl = document.getElementById("loading");
  loadingEl.style.opacity = "0";
  setTimeout(() => loadingEl.remove(), 400);

  let t = 0.0;
  let paused = false;
  let lastTime = performance.now();
  let count = 0;
  let dragAngle = 0.0;
  let isDragging = false;
  let lastDragX = 0;

  canvas.addEventListener("pointerdown", (e) => {
    isDragging = true;
    lastDragX = e.clientX;
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener("pointermove", (e) => {
    if (!isDragging) return;
    const dx = e.clientX - lastDragX;
    lastDragX = e.clientX;
    dragAngle += dx * 0.007;
  });
  canvas.addEventListener("pointerup", () => { isDragging = false; });

  const btnPause = document.getElementById("btnPause");
  const btnRestart = document.getElementById("btnRestart");
  const btnShot = document.getElementById("btnShot");

  function togglePause() {
    paused = !paused;
    btnPause.textContent = paused ? "▶ Resume" : "⏸ Pause";
  }
  function restart() {
    t = 0.0;
    hasTrail = false;
    dragAngle = 0.0;
    if (paused) togglePause();
  }
  function saveScreenshot() {
    const link = document.createElement("a");
    link.download = `i_love_you_friska_${Date.now()}.png`;
    link.href = canvas.toDataURL("image/png");
    link.click();
  }

  btnPause.addEventListener("click", togglePause);
  btnRestart.addEventListener("click", restart);
  btnShot.addEventListener("click", saveScreenshot);

  window.addEventListener("keydown", (e) => {
    if (e.code === "Space") { e.preventDefault(); togglePause(); }
    else if (e.key === "r" || e.key === "R") restart();
    else if (e.key === "s" || e.key === "S") saveScreenshot();
  });

  function frame(now) {
    const dt = (now - lastTime) / 1000.0;
    lastTime = now;

    if (!paused || !hasTrail || isDragging) {
      if (!paused) {
        t += Math.min(dt, 1 / 15);
        if (t > LOOP) t -= LOOP;
      }
      count = renderFrame(t, dragAngle);
      if (!hasTrail) {
        trailBuf.set(outBuf);
        hasTrail = true;
      } else {
        for (let i = 0; i < trailBuf.length; i++) {
          const decayed = trailBuf[i] * TRAIL;
          trailBuf[i] = outBuf[i] > decayed ? outBuf[i] : decayed;
        }
      }
      computeGlow(trailBuf, glow4, 5 / 4);
      computeGlow(trailBuf, glow8, 22 / 8);

      const g4 = glow4.small, gw4 = glow4.gw, gh4 = glow4.gh;
      const g8 = glow8.small, gw8 = glow8.gw, gh8 = glow8.gh;

      for (let y = 0; y < H; y++) {
        const fy4 = Math.max(0, Math.min(gh4 - 1.001, (y + 0.5) * 0.25 - 0.5));
        const y4_0 = fy4 | 0, y4_1 = Math.min(gh4 - 1, y4_0 + 1), wy4 = fy4 - y4_0;
        const fy8 = Math.max(0, Math.min(gh8 - 1.001, (y + 0.5) * 0.125 - 0.5));
        const y8_0 = fy8 | 0, y8_1 = Math.min(gh8 - 1, y8_0 + 1), wy8 = fy8 - y8_0;
        const row = y * W;
        for (let x = 0; x < W; x++) {
          const fx4 = Math.max(0, Math.min(gw4 - 1.001, (x + 0.5) * 0.25 - 0.5));
          const x4_0 = fx4 | 0, x4_1 = Math.min(gw4 - 1, x4_0 + 1), wx4 = fx4 - x4_0;
          const p4_00 = (y4_0 * gw4 + x4_0) * 3, p4_10 = (y4_0 * gw4 + x4_1) * 3;
          const p4_01 = (y4_1 * gw4 + x4_0) * 3, p4_11 = (y4_1 * gw4 + x4_1) * 3;
          const w4_00 = (1 - wx4) * (1 - wy4), w4_10 = wx4 * (1 - wy4), w4_01 = (1 - wx4) * wy4, w4_11 = wx4 * wy4;

          const fx8 = Math.max(0, Math.min(gw8 - 1.001, (x + 0.5) * 0.125 - 0.5));
          const x8_0 = fx8 | 0, x8_1 = Math.min(gw8 - 1, x8_0 + 1), wx8 = fx8 - x8_0;
          const p8_00 = (y8_0 * gw8 + x8_0) * 3, p8_10 = (y8_0 * gw8 + x8_1) * 3;
          const p8_01 = (y8_1 * gw8 + x8_0) * 3, p8_11 = (y8_1 * gw8 + x8_1) * 3;
          const w8_00 = (1 - wx8) * (1 - wy8), w8_10 = wx8 * (1 - wy8), w8_01 = (1 - wx8) * wy8, w8_11 = wx8 * wy8;

          const g4r = g4[p4_00]*w4_00 + g4[p4_10]*w4_10 + g4[p4_01]*w4_01 + g4[p4_11]*w4_11;
          const g4g = g4[p4_00+1]*w4_00 + g4[p4_10+1]*w4_10 + g4[p4_01+1]*w4_01 + g4[p4_11+1]*w4_11;
          const g4b = g4[p4_00+2]*w4_00 + g4[p4_10+2]*w4_10 + g4[p4_01+2]*w4_01 + g4[p4_11+2]*w4_11;

          const g8r = g8[p8_00]*w8_00 + g8[p8_10]*w8_10 + g8[p8_01]*w8_01 + g8[p8_11]*w8_11;
          const g8g = g8[p8_00+1]*w8_00 + g8[p8_10+1]*w8_10 + g8[p8_01+1]*w8_01 + g8[p8_11+1]*w8_11;
          const g8b = g8[p8_00+2]*w8_00 + g8[p8_10+2]*w8_10 + g8[p8_01+2]*w8_01 + g8[p8_11+2]*w8_11;

          const p3 = (row + x) * 3;
          const r = trailBuf[p3]     + g4r * 0.75 + g8r * 0.45;
          const g = trailBuf[p3 + 1] + g4g * 0.75 + g8g * 0.45;
          const b = trailBuf[p3 + 2] + g4b * 0.75 + g8b * 0.45;

          const px = (row + x) * 4;
          pixels[px]     = r >= 1 ? 255 : (r <= 0 ? 0 : (r * 255) | 0);
          pixels[px + 1] = g >= 1 ? 255 : (g <= 0 ? 0 : (g * 255) | 0);
          pixels[px + 2] = b >= 1 ? 255 : (b <= 0 ? 0 : (b * 255) | 0);
        }
      }
    }

    ctx.putImageData(imgData, 0, 0);

    // HUD text matching i_love_you.py
    ctx.font = "17px Consolas, Menlo, 'DejaVu Sans Mono', 'Courier New', monospace";
    const hudY = H - 70;
    ctx.fillStyle = "rgb(255, 122, 182)";
    ctx.fillText("FOR FRISKA ♥ · 2026", 64, hudY - 26);
    ctx.fillStyle = "rgb(120, 112, 128)";
    ctx.fillText(`languages ${N}   phrases ${count}`, 64, hudY);
    ctx.fillText(`letters ${String(count).padStart(5, "0")}`, 64, hudY + 26);

    const dot = (Math.floor(t * 2) % 2 === 0) ? "●" : " ";
    const ttText = `${dot} t ${t.toFixed(2).padStart(5, "0")}s`;
    ctx.fillStyle = "rgb(255, 122, 182)";
    const tw = ctx.measureText(ttText).width;
    ctx.fillText(ttText, W - 64 - tw, 44);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
</script>
